# citi-demo image overrides
# ---------------------------------------------------------------------------
# Points the chart's operator + Target Allocator images at the private ECR repo
# "citi-demo" (single repo, per-component tags):
#
#     037647485236.dkr.ecr.us-west-2.amazonaws.com/citi-demo:operator-r3
#     037647485236.dkr.ecr.us-west-2.amazonaws.com/citi-demo:target-allocator-r3
#
# The CloudWatch Agent is intentionally left on the chart's public image (the
# r3 lineage only customizes the operator + TA for per-node / scraper-routing).
#
# Region pdx (us-west-2) is NOT a key in any image's repositoryDomainMap, so the
# image helper (_helpers.tpl) falls back to repositoryDomainMap.public. We
# override .public with the ECR registry host, set .repository to "citi-demo",
# and pin the per-component tag.
#
# Usage (clusterName + region are still required by the chart):
#   helm upgrade --install amazon-cloudwatch-observability \
#     ./helm-charts/charts/amazon-cloudwatch-observability \
#     --namespace amazon-cloudwatch --create-namespace \
#     --set clusterName=<cluster> --set region=us-west-2 \
#     -f helm-charts/charts/amazon-cloudwatch-observability/citi-demo-values.yaml
# ---------------------------------------------------------------------------

region: us-west-2

# CloudWatch Agent Operator (manager)
manager:
  image:
    repository: citi-demo
    tag: operator-r3
    repositoryDomainMap:
      public: 037647485236.dkr.ecr.us-west-2.amazonaws.com

# Target Allocator (per-node capable build). Agent itself stays on public image.
agent:
  prometheus:
    targetAllocator:
      image:
        repository: citi-demo
        tag: target-allocator-r3
        repositoryDomainMap:
          public: 037647485236.dkr.ecr.us-west-2.amazonaws.com
